# PromptSensitivityFI — versioned config. See Research_Design_v3 §7 / §9.
# Bump `config_version` whenever a value changes; experiments are keyed on it.
config_version: 5
random_seed: 42

# §2.4 — sample sizes per dataset.
sampling:
  hotpotqa:
    n_questions: 100
    stratify_by: level          # {medium, hard}
    split: validation
    hf_dataset: "hotpotqa/hotpot_qa"
    hf_config: "distractor"
  twiki:
    n_questions: 50
    stratify_by: type           # {comparison, inference, compositional, bridge_comparison}
    split: validation
    hf_dataset: "framolfese/2WikiMultihopQA"
    hf_config: null
  # v6 PRIMARY dataset for graded chain-completion scoring (Dataset_Evaluation_v6).
  # Source: official jsonl from StonyBrookNLP/musique `download_data.sh` placed
  # under data/raw/musique/, OR a HF mirror. The loader tries local jsonl first,
  # then `hf_dataset`. MuSiQue-Ans (answerable) variant only.
  musique:
    n_questions: 50
    stratify_by: type           # {2hop, 3hop, 4hop} (derived from hop count)
    split: validation            # mapped to MuSiQue's "dev" jsonl by the loader
    hf_dataset: "dgslibisey/MuSiQue"   # community mirror; override if needed
    hf_config: null
    local_path: null             # e.g. "data/raw/musique/musique_ans_v1.0_dev.jsonl"
  # Specificity pivot (2026-07): AmbigQA is the primary dataset; the manipulated
  # axis is question specificity (ambiguous -> disambiguated), closed-book.
  ambigqa:
    hf_dataset: "ambig_qa"
    hf_config: "light"
    split: validation            # test split is not public
    n_questions: 50
    min_interpretations: 2       # only genuinely ambiguous (multipleQAs) records
    include_single_answer_anchor: false

# Specificity manipulation (pivot spec §9). v1: level 0 = ambiguous question,
# level 1 = disambiguated target interpretation; gold fixed across both.
specificity:
  levels: [0, 1]
  target_seed: 42                # deterministic target-interpretation choice

# §4 — three-ladder construction.
ladders:
  # CONTEXT-ladder levels = number of paragraphs in the prompt at each rung.
  # For HotpotQA (10 paragraphs) these are the full pool. MuSiQue has ~20
  # paragraphs; {0,2,4,6,8,10} is a PREFIX over that larger pool (the gold
  # paragraphs sit among the first ~10 after gold-first ordering). Widen to
  # [0, 4, 8, 12, 16, 20] if you want to sweep the full MuSiQue pool.
  levels: [0, 2, 4, 6, 8, 10]
  k_gold: 2                       # HotpotQA / 2Wiki have 2 gold; MuSiQue has 2-4 (n_hops)
  n_total_paragraphs: 10          # HotpotQA fixed pool; ladder builders use len(paragraphs) dynamically
  variants: [random, gold_first, distractor_first]
  # v6 dual-ladder: "context" feeds paragraphs, "reasoning" feeds decomposition
  # hops 0..k-1 (final hop withheld). Run both on MuSiQue and compare curves.
  families: [context, reasoning]

# §3.1 — paraphrase universe per question.
paraphrases:
  n_per_question: 10              # specificity v1: lowered from 30 for cost; FI_in stays measurable
  # P3-3: generator + judge run on Phi-4-14B (microsoft/phi-4), a DENSE,
  # MIT-licensed model trained on a curated synthetic-textbook distribution
  # distinct from Llama/Mistral/Qwen. This restores cross-generator independence
  # (§7.6.1 R3): the smoke used qwen_2_5_7b, which is also an eval model.
  generator_model: phi_4_14b        # key into `models` below (provider: local)
  generator_temperature: 0.8
  # 2026-06-29: 8 personas (was 4) to widen paraphrase surface variety without
  # answer-set bias (NLI + gold-constraint filters preserve semantics). Trim this
  # list to use fewer; eval cost is unaffected (capped by max_paraphrases).
  templates: [neutral, journalist, casual_user, domain_expert, student, terse_keyword, formal_academic, second_language]
  raw_candidates_per_question: 40
  samples_per_template: 15          # per-iteration batch size; 4 templates × 15 = 60 candidates per iteration.
                                    # Note: total raw is capped by max_regeneration_attempts below.
                                    # Changing this alone does NOT increase the raw budget.
  max_regeneration_attempts: 50     # MAX RAW CANDIDATES PER TEMPLATE (across all iterations).
                                    # Despite the name, this caps `next_sample_start` — so 50 means
                                    # sample_idxs 0..49 per template = 200 total raw across 4 templates.
                                    # Bump this (e.g. to 100) if the smoke shows many `exact_duplicate`
                                    # rejections — that's a generator non-diversity signal and more raw
                                    # candidates is the lever that helps.
  nli:
    model: "MoritzLaurer/DeBERTa-v3-large-mnli-fever-anli-ling-wanli"
    bidirectional_threshold: 0.9
    fallback_threshold: 0.85
  constraint_filter:
    judge_model: phi_4_14b          # Phi-4 generator doubles as the gold-based judge (P3-3)
    jaccard_threshold: 0.9
    # Was 256, but the smoke run caught the judge returning truncated JSON
    # (e.g. `{"answers": ["private equity", "private`) which fell back to []
    # and forced Jaccard=0 -> false rejection. 1024 leaves headroom for long
    # answer-variant lists.
    judge_max_tokens: 1024
  deduplication:
    # Distance metric for dedup. See `paraphrases/deduplicate.py` docstring.
    #   "char"  — character-level Levenshtein (brief's default; min=6 means
    #              the brief's "edit distance > 5"). Recommended for long
    #              questions (>100 chars).
    #   "token" — whitespace-tokenised word-level. Recommended min=3 (>=3
    #              word swaps). Switch to this if a sizable fraction of the
    #              sample has short questions (~80 chars / ~12 tokens) where
    #              char-level over-rejects: the 2026-05-21 smoke showed
    #              q2/q3 (port-city / Wilmslow-school questions) drop 350+
    #              candidates per attempt under char mode.
    metric: char
    min_edit_distance: 6

# §5 — models. Sprint 6: the three EVAL models now run LOCALLY (provider:
# `local`, Hugging Face transformers in-process on the cluster GPU) — see
# models/local_hf.py. This REVERSES the 2026-05-12 gateway substitutions: we
# now serve the design doc's actual intended models (real Mistral-7B-v0.3 and
# real Qwen2.5-7B, not Teuken-7B / a Qwen3-MoE). Flag this as an IMPROVEMENT
# over the gateway run in the writeup.
#
# Capability flags — in-process transformers exposes everything the gateway
# could not:
#   - chat_logprobs:    full-vocab per-token logprobs from generate() scores.
#   - echo_completions: exact teacher-forced log P(y|x) via one forward pass
#                       (POSIX) — no "echo" hack, no provider support needed.
#   - has_hidden:       TRUE now — last-layer hidden states reachable
#                       (ESS_in^own / rho_u^own). Was false everywhere on gw.
#
# model_id is the HF repo id. Llama-3.1-8B and Mistral-7B-v0.3 are GATED:
# accept their licenses + `huggingface-cli login` once on the cluster (see
# cluster/README.md). qwen_2_5_7b doubles as the paraphrase generator + judge.
models:
  llama_3_1_8b:
    provider: local
    model_id: "meta-llama/Llama-3.1-8B-Instruct"
    chat_logprobs: true
    echo_completions: true
    has_hidden: true
  mistral_7b_v03:
    provider: local
    model_id: "mistralai/Mistral-7B-Instruct-v0.3"
    chat_logprobs: true
    echo_completions: true
    has_hidden: true
  qwen_2_5_7b:
    provider: local
    model_id: "Qwen/Qwen2.5-7B-Instruct"
    chat_logprobs: true
    echo_completions: true
    has_hidden: true
  phi_4_14b:
    # P3-3: paraphrase generator + gold-based judge ONLY (not an eval model), so
    # it needs none of logprobs / echo / hidden — flags off so local_check gates
    # by capability and won't fail-gate it. Dense 14B, MIT license (no HF token).
    provider: local
    model_id: "microsoft/phi-4"
    chat_logprobs: false
    echo_completions: false
    has_hidden: false
  gpt_4o:
    # LEGACY gateway entry — kept so non-cluster gateway runs still resolve, but
    # UNUSED on the cluster (no LiteLLM endpoint there). Not a `provider: local`
    # model, so scripts/local_check.py skips it.
    provider: litellm
    model_id: "kit.gpt-4.1"
    chat_logprobs: true
    echo_completions: false
    has_hidden: false

# §6 — F(x) scoring.
scoring:
  method: "nli_with_gold"           # NEVER exact_match (Hua 2025 EMNLP arXiv:2509.01790)
  nli_model: "MoritzLaurer/DeBERTa-v3-large-mnli-fever-anli-ling-wanli"
  entail_threshold: 0.7
  contradict_threshold: 0.5
  exact_match_appendix_only: true
  # P0-2b: looser bar for the SECONDARY final-answer score only (parallel
  # permissive column); strict entail_threshold above is unchanged.
  entail_threshold_permissive: 0.5
  # v6 graded chain-completion (MuSiQue). null => reuse the binary thresholds
  # above. Set explicitly if hop recovery should use a different bar.
  chain_entail_threshold: null
  chain_contradict_threshold: null

# v6 — model generation token budgets (separate from paraphrase generation).
generation:
  answer_max_tokens: 64             # baseline "answer briefly" responses
  cot_max_tokens: 512               # CoT responses need room for a full chain

# §3 — H_sem clustering (Farquhar 2024 Nature).
h_sem:
  n_samples_per_prompt: 10        # do NOT let the smoke override below 5 silently
  sampling_temperature: 1.0
  cluster_nli_model: "MoritzLaurer/DeBERTa-v3-large-mnli-fever-anli-ling-wanli"
  cluster_threshold: 0.5          # used only when cluster_criterion == "prob"
  cluster_criterion: "label"      # 2026-06-28: argmax NLI==entailment both ways (strict)
  cluster_on: "answer"            # 2026-06-28: cluster parse_answer_line(sample), not full text

# §7.6.3 — bootstrap CIs.
bootstrap:
  n_iterations: 1000
  confidence: 0.95

# Embedding encoders.
embedding:
  external_encoder: "sentence-transformers/all-mpnet-base-v2"
  # Gateway-routed OpenAI embedding; useful for closed-model proxy embeddings.
  gateway_encoder: "text-embedding-3-large"

# API access — single LiteLLM gateway.
api:
  base_url_env: "LITELLM_BASE_URL"
  api_key_env: "LITELLM_API_KEY"
  default_base_url: "https://ai-gateway.dsi-experimente.de/v1"
  max_retries: 6
  initial_backoff_s: 1.0
  max_backoff_s: 60.0
  rate_limit_qps:
    litellm: 10.0                  # conservative until we benchmark; gateway-side limit unknown
    local: 1000.0                  # in-process transformers: no network, effectively unthrottled

# Cache — hash-based; never re-call same (prompt, model, sampling-params).
cache:
  backend: sqlite
  path: "data/cache/llm_cache.sqlite"

# Spend guard. The gateway tracks per-key spend server-side; this is a local
# soft cap surfaced in scripts so we abort if the supervisor's budget is at risk.
spend:
  pilot_usd_cap: 150.0
